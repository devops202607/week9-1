replicaCount: 1

image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

imagePullSecrets: []

otel:
  serviceName: otel-demo-app
  tracesEndpoint: http://opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
  metricsEndpoint: http://opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/metrics
