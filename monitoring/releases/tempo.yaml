apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 15m0s
  chart:
    spec:
      chart: tempo
      version: "1.18.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  values:
    tempo:
      reportingEnabled: false
      receivers:
        otlp:
          protocols:
            grpc:
              enabled: true
            http:
              enabled: true
