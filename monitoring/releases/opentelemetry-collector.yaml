apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: monitoring
spec:
  interval: 15m0s
  chart:
    spec:
      chart: k8s-monitoring
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cluster:
      name: week9-1
    destinations:
      - name: prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      - name: loki
        type: loki
        url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
      - name: tempo
        type: otlp
        protocol: http
        url: http://tempo.monitoring.svc.cluster.local:4318
    clusterMetrics:
      enabled: false
    prometheusOperatorObjects:
      enabled: false
    clusterEvents:
      enabled: false
    podLogs:
      enabled: false
    applicationObservability:
      enabled: true
      receivers:
        otlp:
          grpc:
            enabled: true
          http:
            enabled: true
      connectors:
        grafanaCloudMetrics:
          enabled: false
