apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: monitoring
spec:
  interval: 15m0s
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.173.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: deployment
    image:
      repository: otel/opentelemetry-collector-k8s
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch: {}
      exporters:
        otlphttp/tempo:
          endpoint: http://tempo.monitoring.svc.cluster.local:4318
        prometheus:
          endpoint: 0.0.0.0:9464
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/tempo]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        hostPort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        hostPort: 4318
        protocol: TCP
      metrics:
        enabled: true
        containerPort: 9464
        servicePort: 9464
        protocol: TCP
    serviceMonitor:
      enabled: true
      extraLabels:
        release: kube-prometheus-stack
