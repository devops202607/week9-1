apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  interval: 15m0s
  chart:
    spec:
      chart: fluent-bit
      version: "2.6.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: fluent-bit
    serviceMonitor:
      enabled: true
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 1
            Log_Level info
            Parsers_File parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 50MB
            Skip_Long_Lines On

        [INPUT]
            Name systemd
            Tag host.*
            Systemd_Filter _SYSTEMD_UNIT=kubelet.service
            Read_From_Tail On

        [INPUT]
            Name systemd
            Tag node.*
            Systemd_Filter _SYSTEMD_UNIT=containerd.service
            Read_From_Tail On
      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Kube_Tag_Prefix kube.var.log.containers.
            Merge_Log On
            Keep_Log Off
            K8S-Logging.Parser On
            K8S-Logging.Exclude Off
      outputs: |
        [OUTPUT]
            Name loki
            Match *
            Host loki-gateway.monitoring.svc.cluster.local
            Port 80
            Labels job=fluent-bit,cluster=week9-1
            Label_keys $sub['kubernetes']['namespace_name'],$sub['kubernetes']['pod_name'],$sub['kubernetes']['container_name']
            Line_Format json
    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: runlogjournal
        hostPath:
          path: /run/log/journal
      - name: machineid
        hostPath:
          path: /etc/machine-id
          type: File
    daemonSetVolumeMounts:
      - name: varlog
        mountPath: /var/log
      - name: runlogjournal
        mountPath: /run/log/journal
        readOnly: true
      - name: machineid
        mountPath: /etc/machine-id
        readOnly: true
